<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Plate / App Icon Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Drafting Grid (Subtle) -->
  <path d="M16 8v48M32 8v48M48 8v48M8 16h48M8 32h48M8 48h48" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4"/>

  <!-- CAD Vector Geometry Group -->
  <g filter="url(#glow)">
    <!-- Dimension Axis / Construction Lines -->
    <line x1="12" y1="52" x2="52" y2="52" stroke="#64748b" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="12" y1="12" x2="12" y2="52" stroke="#64748b" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Isometric/Polyline Wireframe representing DWG/DXF Model -->
    <polygon points="32,14 50,26 50,46 32,54 14,46 14,26" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Internal CAD Details / Cross Bracing -->
    <line x1="32" y1="14" x2="32" y2="54" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="14" y1="26" x2="50" y2="46" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="50" y1="26" x2="14" y2="46" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>

    <!-- Vertex Points / Snap Nodes -->
    <circle cx="32" cy="14" r="2.5" fill="url(#orangeGrad)"/>
    <circle cx="50" cy="26" r="2.5" fill="url(#orangeGrad)"/>
    <circle cx="50" cy="46" r="2.5" fill="url(#orangeGrad)"/>
    <circle cx="32" cy="54" r="2.5" fill="url(#orangeGrad)"/>
    <circle cx="14" cy="46" r="2.5" fill="url(#orangeGrad)"/>
    <circle cx="14" cy="26" r="2.5" fill="url(#orangeGrad)"/>
  </g>
</svg>
